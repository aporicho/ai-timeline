  <script>
  (() => {
    const payload = JSON.parse(document.getElementById('protected-payload').textContent);
    const storageKey = 'ai-timeline:session:' + location.pathname.slice(0, location.pathname.lastIndexOf('/') + 1);
    const form = document.getElementById('unlock-form');
    const input = document.getElementById('password');
    const submit = form.querySelector('.submit');
    const error = document.getElementById('error');
    const encoder = new TextEncoder();
    const decode = value => Uint8Array.from(atob(value), c => c.charCodeAt(0));
    const encode = value => btoa(String.fromCharCode(...value));
    const forget = () => { try { sessionStorage.removeItem(storageKey); } catch {} };

    form.querySelector('.visibility').addEventListener('click', event => {
      const visible = input.type === 'password';
      input.type = visible ? 'text' : 'password';
      event.currentTarget.setAttribute('aria-label', visible ? '隐藏密码' : '显示密码');
      event.currentTarget.setAttribute('aria-pressed', String(visible));
    });
    input.addEventListener('input', () => { error.textContent = ''; input.removeAttribute('aria-invalid'); });

    async function decrypt(rawKey) {
      const key = await crypto.subtle.importKey('raw', rawKey, {name:'AES-GCM'}, false, ['decrypt']);
      const clear = await crypto.subtle.decrypt({name:'AES-GCM', iv:decode(payload.iv), additionalData:encoder.encode(payload.page), tagLength:128}, key, decode(payload.ciphertext));
      return new TextDecoder('utf-8', {fatal:true}).decode(clear);
    }

    async function show(html) {
      // Cached decryption can finish while the inline script's HTML parser is
      // still active. document.open() is then ignored, so document.write()
      // inserts the app into the password page instead of replacing it.
      // Wait until parsing has finished and leave the parser's current task.
      if (document.readyState === 'loading') {
        await new Promise(resolve => document.addEventListener('DOMContentLoaded', resolve, {once:true}));
      }
      await new Promise(resolve => setTimeout(resolve, 0));
      // The lock action is installed into the decrypted document; the key stays in this tab's session storage.
      const lockScript = '<script>window.lockTimeline=function(){try{sessionStorage.removeItem(' + JSON.stringify(storageKey) + ')}catch{}location.reload()};<\/script>';
      html = html.replace('<head>', '<head><meta name="robots" content="noindex, nofollow, noarchive" />' + lockScript);
      document.open();
      document.write(html);
      document.close();
    }

    async function unlock(event) {
      event.preventDefault();
      if (!globalThis.crypto?.subtle) {
        error.textContent = '当前环境不支持解锁，请通过 HTTPS 打开页面。';
        return;
      }
      submit.disabled = true;
      submit.textContent = '正在验证…';
      error.textContent = '';
      let html;
      try {
        const material = await crypto.subtle.importKey('raw', encoder.encode(input.value), 'PBKDF2', false, ['deriveBits']);
        const rawKey = new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:decode(payload.salt), iterations:payload.iterations}, material, 256));
        html = await decrypt(rawKey);
        try { sessionStorage.setItem(storageKey, JSON.stringify({salt:payload.salt, key:encode(rawKey)})); } catch {}
        input.value = '';
      } catch {
        forget();
        error.textContent = '密码不正确，请重试。';
        input.setAttribute('aria-invalid', 'true');
        submit.disabled = false;
        submit.textContent = '进入阅读';
        input.focus();
        return;
      }
      await show(html);
    }

    form.addEventListener('submit', unlock);
    (async () => {
      if (!globalThis.crypto?.subtle) return;
      try {
        const saved = JSON.parse(sessionStorage.getItem(storageKey) || 'null');
        if (saved?.salt === payload.salt) await show(await decrypt(decode(saved.key)));
        else forget();
      } catch { forget(); }
    })();
  })();
  </script>
